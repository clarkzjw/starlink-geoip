name: Hourly Jobs

on:
  push:
    branches:
      - master
  pull_request:
      branches:
        - master
  schedule:
    - cron: "0 */4 * * *"


jobs:
  geoip:
    runs-on: [self-hosted, starlink]
    permissions:
      contents: write
      packages: write
      id-token: write
    name: Refresh GeoIP
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Get latest data
        run: rm -rf starlink-geoip-data && git clone --depth=1 https://github.com/clarkzjw/starlink-geoip-data.git && rm -rf starlink-geoip-data/.git
      - name: Install dependencies
        run: echo ${{ secrets.USERPWD }} | sudo -S apt-get update && sudo -S apt-get install dnsutils -y
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install project dependencies
        run: uv sync --locked
      - name: Refresh GeoIP
        run: env PYTHONUNBUFFERED=1 uv run python run.py
      - name: Push GeoIP
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: git@github.com:clarkzjw/starlink-geoip-data.git
          BRANCH: master
          FOLDER: starlink-geoip-data
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_KEY }}
          MESSAGE: "GitHub Action Update - Starlink GeoIP Feed"
          SKIP_EMPTY_COMMITS: true
          CLEAR_GLOBS_FILE: ".clear-target-files"
      - name: Cleanup
        run: rm -rf /tmp/starlink-geoip-* && rm -rf /tmp/git-publish-subdir-action-*
